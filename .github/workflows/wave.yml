
name: Generate Quantum Wave Scattering

on:
  schedule:
    - cron: "0 3 * * *" # Meia-noite no horário de Brasília (UTC-3)
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build_and_generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Baixar contribuições públicas e privadas via GraphQL
        env:
          GH_CONTRIBUTIONS_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_CONTRIBUTIONS_TOKEN" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"query":"query { user(login: \"alanmaioli\") { contributionsCollection { contributionCalendar { weeks { contributionDays { contributionCount weekday } } } } } }"}' \
            https://api.github.com/graphql \
            -o commits.json

          python3 -c '
          import json
          with open("commits.json") as f:
              data = json.load(f)
          if data.get("errors") or not data.get("data", {}).get("user"):
              raise SystemExit("Erro ao consultar contribuições: " + str(data.get("errors")))
          print("Calendário de contribuições carregado.")
          '

      - name: Compilar e rodar o espalhamento quântico em C++
        run: |
          mkdir -p dist
          g++ -O2 waveshow_win.cpp -o waveshow
          ./waveshow
          mv github-wave.svg dist/github-wave.svg

      - name: Publicar SVG na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
